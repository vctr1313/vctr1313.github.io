<style>
:root {
  /* Deep teal canvas like a process explorer: teal marks cases that flow, amber marks bottlenecks. */
  --deep: #0A2A30;
  --deep-2: #0E343B;
  --deep-3: #12404A;
  --deep-line: rgba(160, 222, 222, 0.16);
  --on-deep: #EAF4F4;
  --on-deep-soft: #C3D8D9;
  --on-deep-muted: #8FB0B3;
  --flow: #4FD1C5;
  --flow-ink: #052A2E;
  --heat: #F5A524;
  --heat-soft: #F8C66E;
  --paper: #F2F6F6;
  --surface: #FFFFFF;
  --ink: #0E2329;
  --muted: #56696F;
  --line: #D5E0E2;
  --accent: #0B6E77;
  --accent-soft: #E1F0F0;
  --focus: var(--accent);
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0B1C20;
    --surface: #0F262B;
    --ink: #E3EDEE;
    --muted: #97ADB1;
    --line: #21393F;
    --accent: #5BD3C7;
    --accent-soft: #12363C;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1140px; margin: 0 auto; padding: 0 28px; }
.ic { width: 18px; height: 18px; flex: none; display: block; }
.dark { --focus: var(--flow); }

/* ---------- Top bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(10, 42, 48, 0.88);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--deep-line);
  color: var(--on-deep);
}
.bar-in { max-width: 1140px; margin: 0 auto; padding: 9px 28px; min-height: 62px; display: flex; align-items: center; gap: 18px; }
.bar-name {
  background: none; border: 0; padding: 6px 0; cursor: pointer;
  font-weight: 720; font-size: 15px; font-stretch: 118%; letter-spacing: -0.005em; white-space: nowrap;
  opacity: 0; transform: translateY(6px); pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.bar.scrolled .bar-name { opacity: 1; transform: none; pointer-events: auto; }
.bar-nav { position: relative; display: flex; gap: 2px; margin-left: auto; }
.bar-nav button {
  background: none; border: 0; cursor: pointer; border-radius: 8px;
  padding: 10px 12px; font-size: 14px; font-weight: 520; color: var(--on-deep-muted);
  transition: color .2s;
}
.bar-nav button:hover, .bar-nav button[aria-current="true"] { color: var(--on-deep); }
.nav-ind {
  position: absolute; left: 0; bottom: 3px; height: 2px; width: 0; border-radius: 2px;
  background: var(--flow); opacity: 0;
  transition: transform .4s var(--ease), width .4s var(--ease), opacity .3s;
}
.bar-actions { display: flex; align-items: center; gap: 10px; }
.lang { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--deep-line); }
.lang button {
  border: 0; background: transparent; cursor: pointer; border-radius: 999px;
  padding: 8px 11px; font-size: 13px; font-weight: 650; letter-spacing: 0.02em; color: var(--on-deep-muted);
  transition: background .25s, color .25s;
}
.lang button[aria-pressed="true"] { background: var(--on-deep); color: var(--deep); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  border-radius: 999px; border: 1px solid transparent; cursor: pointer; text-decoration: none;
  padding: 13px 20px; font-size: 15px; font-weight: 650; line-height: 1; white-space: nowrap;
  transition: box-shadow .25s, border-color .25s, background .25s, transform .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--flow); color: var(--flow-ink); }
.btn-primary:hover { box-shadow: 0 0 0 5px rgba(79, 209, 197, 0.22); }
.btn-ghost { background: transparent; color: var(--on-deep); border-color: rgba(234, 244, 244, 0.3); }
.btn-ghost:hover { border-color: var(--on-deep); }
.btn-bar { padding: 10px 15px; font-size: 14px; }
.btn .short { display: none; }
.btn[aria-busy="true"] { cursor: progress; opacity: .85; }
.motion .btn[aria-busy="true"] .ic { animation: bob .9s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
.no-dl [data-pdf] { display: none; }

/* ---------- Hero ---------- */
.hero {
  background-color: var(--deep);
  background-image: radial-gradient(rgba(160, 222, 222, 0.11) 1px, transparent 1.5px);
  background-size: 24px 24px;
  color: var(--on-deep);
}
.hero-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 60px; align-items: start;
  padding-top: 64px; padding-bottom: 84px;
}
.photo {
  width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: block;
  box-shadow: 0 0 0 3px var(--deep), 0 0 0 5px var(--flow);
}
.name {
  margin: 30px 0 0;
  font-size: clamp(2.05rem, 5.3vw, 3.85rem); font-weight: 780; font-stretch: 125%;
  line-height: 0.98; letter-spacing: -0.02em; text-wrap: balance;
}
.role { margin: 16px 0 0; font-size: 1.14rem; font-weight: 620; color: var(--flow); max-width: 40ch; line-height: 1.4; }
.summary { margin: 16px 0 0; color: var(--on-deep-soft); max-width: 58ch; font-size: 1.02rem; }
.contact-list { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px 26px; font-size: 0.95rem; }
.contact-list li { display: flex; align-items: center; gap: 9px; min-width: 0; }
.contact-list .ic { color: var(--flow); width: 17px; height: 17px; }
.contact-list a { color: var(--on-deep); text-decoration: none; border-bottom: 1px solid rgba(234, 244, 244, 0.25); overflow-wrap: anywhere; }
.contact-list a:hover { border-bottom-color: var(--flow); }
.copy {
  display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; cursor: pointer;
  border-radius: 8px; border: 1px solid var(--deep-line); background: transparent; color: var(--on-deep-muted);
  transition: color .2s, border-color .2s;
}
.copy .ic { width: 15px; height: 15px; color: inherit; }
.copy:hover { color: var(--on-deep); border-color: rgba(234, 244, 244, 0.45); }
.copy.done { color: var(--flow); border-color: var(--flow); }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

/* ---------- Live process simulation ---------- */
.sim {
  margin: 0; position: relative;
  background: var(--deep-2); border: 1px solid var(--deep-line); border-radius: 20px;
  padding: 20px 20px 18px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.28);
}
.sim-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.sim-title { margin: 0; font-size: 1rem; font-weight: 720; font-stretch: 110%; line-height: 1.3; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 600; color: var(--flow); white-space: nowrap; margin-top: 2px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--flow); position: relative; }
.motion .live i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--flow); animation: ring 1.8s ease-out infinite; }
.paused .live i::after { animation: none; opacity: 0; }
@keyframes ring { from { transform: scale(.5); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
.sim-sub { margin: 6px 0 0; font-size: 0.86rem; color: var(--on-deep-muted); line-height: 1.45; }
.sim-stage { position: relative; margin-top: 10px; }
#sim-svg { display: block; width: 100%; height: auto; overflow: visible; }
#sim-svg .edge { fill: none; stroke: rgba(143, 176, 179, 0.6); stroke-linecap: round; stroke-width: 2; transition: stroke-width .5s var(--ease); }
#sim-svg .edge.rw { stroke: rgba(245, 165, 36, 0.62); }
#sim-svg .ar { fill: rgba(143, 176, 179, 0.85); }
#sim-svg .ar-rw { fill: rgba(245, 165, 36, 0.85); }
#sim-svg .node rect { fill: #0A2D33; stroke: rgba(79, 209, 197, 0.5); stroke-width: 1.2; }
#sim-svg .node.rw rect { stroke: rgba(245, 165, 36, 0.7); }
#sim-svg .node text { fill: var(--on-deep); font-family: var(--font); font-size: 13.5px; font-weight: 620; text-anchor: middle; dominant-baseline: central; }
#sim-svg .node.rw text { fill: var(--heat-soft); }
#sim-svg .count { fill: var(--on-deep-muted); font-family: var(--font); font-size: 11.5px; font-weight: 560; font-variant-numeric: tabular-nums; }
#sim-svg .count.rw { fill: rgba(248, 198, 110, 0.85); }
#sim-svg .term { fill: var(--on-deep-muted); }
#sim-svg .tok { fill: var(--flow); }
#sim-svg .tok.flag { fill: var(--heat); }
#sim-svg #toks { transition: opacity .6s; }
#sim-svg .badge { opacity: 0; transition: opacity .3s; }
#sim-svg .badge.on { opacity: 1; }
#sim-svg .badge rect { fill: var(--heat); }
#sim-svg .badge text { fill: #2B1A00; font-family: var(--font); font-size: 11px; font-weight: 760; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
#sim-svg .ping { fill: none; stroke: var(--flow); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
#sim-svg .ping.go { animation: ping .9s ease-out; }
@keyframes ping { from { opacity: .9; transform: scale(.7); } to { opacity: 0; transform: scale(1.7); } }
.motion #sim-svg .edge { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s .55s var(--ease) forwards; }
.motion #sim-svg .node, .motion #sim-svg .count { animation: fade .6s .45s both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.sim-toast {
  position: absolute; left: 50%; bottom: 6px; max-width: calc(100% - 16px);
  display: flex; align-items: center; gap: 9px;
  padding: 9px 13px; border-radius: 12px; font-size: 0.8rem; line-height: 1.3;
  background: #F4FBFA; color: #0B2A2E; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  opacity: 0; transform: translate(-50%, 10px); pointer-events: none;
  transition: opacity .3s, transform .35s var(--ease);
}
.sim-toast .ic { width: 16px; height: 16px; color: var(--accent); }
.sim-toast.show { opacity: 1; transform: translate(-50%, 0); }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.kpi { border: 1px solid var(--deep-line); background: rgba(255, 255, 255, 0.035); border-radius: 12px; padding: 10px 12px 11px; min-width: 0; }
.kpi-l { display: block; font-size: 0.74rem; line-height: 1.25; color: var(--on-deep-muted); }
.kpi-v { display: block; margin-top: 5px; font-size: 1.45rem; font-weight: 720; font-stretch: 112%; line-height: 1.05; font-variant-numeric: tabular-nums; transition: color .5s; white-space: nowrap; }
.kpi-v small { font-size: 0.72rem; font-weight: 560; font-stretch: 100%; color: var(--on-deep-muted); margin-left: 3px; }
.kpi.good .kpi-v { color: var(--flow); }
.kpi.bad .kpi-v { color: var(--heat); }

.sim-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-top: 14px; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { position: relative; flex: none; width: 46px; height: 26px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); transition: background .25s; }
.thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--on-deep); transition: transform .3s var(--ease), background .25s; }
.switch input:checked + .track { background: var(--flow); }
.switch input:checked + .track .thumb { transform: translateX(20px); background: var(--flow-ink); }
.switch input:focus-visible + .track { outline: 2px solid var(--flow); outline-offset: 3px; }
.motion .switch.hint .track { animation: hint 1.8s ease-out 2s 4; }
@keyframes hint { 0% { box-shadow: 0 0 0 0 rgba(79, 209, 197, .55); } 100% { box-shadow: 0 0 0 12px rgba(79, 209, 197, 0); } }
.switch-text b { display: block; font-size: 0.92rem; font-weight: 680; }
.switch-text small { display: block; font-size: 0.78rem; color: var(--on-deep-muted); line-height: 1.3; }
.pql-btn {
  background: none; cursor: pointer; border-radius: 999px; border: 1px solid var(--deep-line);
  padding: 8px 13px; font-size: 0.8rem; font-weight: 600; color: var(--flow);
}
.pql-btn:hover { border-color: var(--flow); }
.pql { margin-top: 12px; }
.pql p { margin: 0 0 7px; font-size: 0.78rem; color: var(--on-deep-muted); }
.pql pre {
  margin: 0; padding: 12px 14px; border-radius: 12px; background: #062329; border: 1px solid var(--deep-line);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: #CFE7E6;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.pql .fn { color: var(--flow); }
.pql .kw { color: #A9C7FF; }
.pql .str { color: var(--heat-soft); }

/* ---------- Sections ---------- */
main { display: block; }
.sec { padding-top: 92px; scroll-margin-top: 70px; }
.sec-head { margin-bottom: 30px; }
.sec h2, .contact-band h2 {
  margin: 0; font-size: clamp(1.75rem, 3.6vw, 2.45rem); font-weight: 760; font-stretch: 118%;
  letter-spacing: -0.015em; line-height: 1.05;
}
.lead { margin: 10px 0 0; color: var(--muted); max-width: 62ch; font-size: 1.02rem; }

/* Experience timeline */
.timeline { position: relative; padding-left: 46px; max-width: 880px; }
.rail { position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
.rail-fill { position: absolute; inset: 0; background: var(--accent); transform-origin: top; transform: scaleY(0); }
.jobs { display: grid; gap: 22px; }
.job { position: relative; }
.rail-dot {
  position: absolute; left: -40px; top: 28px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--line); transition: border-color .35s, background .35s, box-shadow .35s;
}
.job.lit .rail-dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.job-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; }
.job.current .job-card { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.job-top { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.job h3 { margin: 0; font-size: 1.24rem; font-weight: 740; font-stretch: 110%; line-height: 1.25; }
.job h3 .team { font-weight: 480; font-stretch: 100%; color: var(--muted); }
.now { display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 650; color: var(--accent); background: var(--accent-soft); padding: 5px 11px 5px 9px; border-radius: 999px; }
.now i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.motion .now i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); animation: ring 1.8s ease-out infinite; }
.place { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }
.roles { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 3px; }
.roles li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; }
.roles .title { font-weight: 640; }
.when { margin-left: auto; color: var(--muted); font-size: 0.9rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.points { margin: 14px 0 0; padding-left: 20px; }
.points li { margin: 6px 0; padding-left: 2px; }
.points li::marker { color: var(--accent); }
.tags { list-style: none; display: flex; flex-wrap: wrap; gap: 7px; margin: 16px 0 0; padding: 0; }
.tags li { font-size: 0.78rem; font-weight: 640; color: var(--accent); background: var(--accent-soft); padding: 5px 10px; border-radius: 999px; }

/* Projects */
.projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.project { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
.project.featured { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.preview {
  background-color: var(--deep);
  background-image: radial-gradient(rgba(160, 222, 222, 0.10) 1px, transparent 1.5px);
  background-size: 20px 20px;
  display: grid; place-items: center; padding: 18px; min-height: 220px;
}
.preview svg { width: 100%; max-width: 330px; height: auto; }
.project-body { padding: 24px 26px 26px; display: flex; flex-direction: column; gap: 10px; }
.project-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.84rem; color: var(--muted); font-weight: 600; }
.status { color: #8A5200; background: #FCEBCB; padding: 4px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 680; }
@media (prefers-color-scheme: dark) { .status { color: var(--heat-soft); background: #3A2A10; } }
.project h3 { margin: 0; font-size: 1.42rem; font-weight: 760; font-stretch: 114%; line-height: 1.15; }
.project p { margin: 0; }
.stack { list-style: none; display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 0; padding: 0; }
.stack li { font-size: 0.8rem; font-weight: 560; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 10px; }
.link-btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font-size: 0.92rem; font-weight: 650; color: var(--accent);
  border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; transition: border-color .2s, background .2s;
}
.link-btn .ic { width: 16px; height: 16px; }
.link-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

/* Project previews (illustrations) */
.pv { overflow: visible; }
.pv .ln { fill: none; stroke: rgba(234, 244, 244, 0.32); stroke-width: 1.4; }
.pv .card { fill: rgba(255, 255, 255, 0.06); stroke: rgba(234, 244, 244, 0.2); stroke-width: 1.2; }
.pv .txt { fill: rgba(234, 244, 244, 0.28); }
.pv .txt-strong { fill: rgba(234, 244, 244, 0.7); }
.pv .trk { fill: rgba(255, 255, 255, 0.1); }
.pv .f-flow { fill: var(--flow); }
.pv .f-heat { fill: var(--heat); }
.pv .f-soft { fill: rgba(79, 209, 197, 0.45); }
.pv .s-flow { fill: none; stroke: var(--flow); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pv .ringtrack { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 8; }
.pv .ringval { fill: none; stroke: var(--flow); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 36; }
.pv .gx, .pv .gy, .pv .pop, .pv .eye, .pv .mark { transform-box: fill-box; }
.pv .gx { transform-origin: left center; }
.pv .gy { transform-origin: center bottom; }
.pv .pop, .pv .eye, .pv .mark { transform-origin: center; }
.pv .draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
.motion .pv .gx { transform: scaleX(0); }
.motion .pv .gy { transform: scaleY(0); }
.motion .pv .pop, .motion .pv .mark, .motion .pv .float { opacity: 0; }
.motion .pv .ringval { stroke-dashoffset: 100; }
.motion .pv .draw { stroke-dashoffset: 1; }
.motion .in-view .pv .gx { animation: gx 1s var(--d, 0s) var(--ease) forwards; }

function renderJobs(l) {
  const T = UI[l];
  return CV.jobs.map((j) => {
    const roles = j.roles.map((r) => `<li><span class="title">${esc(pick(r.title, l))}</span><span class="when">${esc(pick(r.from, l))} – ${esc(r.to === "present" ? T.present : pick(r.to, l))}</span></li>`).join("");
    const pts = j.points ? `<ul class="points">${j.points[l].map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
    const tags = j.tags ? `<ul class="tags" aria-label="${esc(T.tagsAria)}">${j.tags.map((x) => `<li>${esc(pick(x, l))}</li>`).join("")}</ul>` : "";
    const team = j.team ? ` <span class="team">${esc(j.team)}</span>` : "";
    const now = j.current ? `<span class="now"><i aria-hidden="true"></i>${esc(T.now)}</span>` : "";
    return `<article class="job${j.current ? " current" : ""}"><span class="rail-dot" aria-hidden="true"></span><div class="job-card"><div class="job-top"><h3>${esc(j.company)}${team}</h3>${now}</div><p class="place">${esc(pick(j.place, l))}</p><ul class="roles">${roles}</ul>${pts}${tags}</div></article>`;
  }).join("");
}

function renderProjects(l) {
  return CV.projects.map((p) => {

  };
  const RW = new Set(["po-price", "price-gr", "inv-block", "block-pay"]);
  const LABELS = { "po-gr": [131, 99], "gr-inv": [131, 209], "inv-pay": [131, 319], "po-price": [240, 38], "inv-block": [240, 258] };
  const SPD = 0.085;     // real seconds per simulated day
  const SPAWN = 2.6;     // simulated days between new purchase orders
  const WINDOW = 30;     // completed cases used for the KPIs

  let flows = false, time = 0, spawnAcc = 0, paid = 0, lastAlert = 0;
  const active = [], recent = [], pool = [];
  const counts = {};
  Object.keys(EDGES).forEach((k) => { counts[k] = 0; });
  const rnd = (a, b) => a + Math.random() * (b - a);

  // Build the map once.
  const parts = [`<defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ar"/></marker>
    <marker id="ar-rw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ar-rw"/></marker>
  </defs>`];
  for (const [id, e] of Object.entries(EDGES)) {
    const isEnd = id === "pay-end";
    parts.push(`<path class="edge${RW.has(id) ? " rw" : ""}" data-e="${id}" d="${e.d}" pathLength="1"${isEnd ? "" : ` marker-end="url(#${RW.has(id) ? "ar-rw" : "ar"})"`}/>`);
  }
  for (const [id, [x, y]] of Object.entries(LABELS)) parts.push(`<text class="count${RW.has(id) ? " rw" : ""}" data-c="${id}" x="${x}" y="${y}">0</text>`);
  parts.push(`<circle class="term" cx="120" cy="6" r="4"/><circle class="term" cx="120" cy="432" r="4"/>`);
  for (const [id, n] of Object.entries(NODES)) {
    parts.push(`<g class="node${n.rw ? " rw" : ""}"><rect x="${n.cx - n.w / 2}" y="${n.cy - H / 2}" width="${n.w}" height="${H}" rx="10"/><text x="${n.cx}" y="${n.cy}" data-n="${id}"></text></g>`);
  }
  parts.push(`<circle class="ping" id="ping" cx="296" cy="315" r="22"/>`);
  parts.push(`<g class="badge" data-b="price-gr" transform="translate(362 76)"><rect x="-15" y="-10" width="30" height="20" rx="10"/><text>0</text></g>`);
  parts.push(`<g class="badge" data-b="block-pay" transform="translate(362 296)"><rect x="-15" y="-10" width="30" height="20" rx="10"/><text>0</text></g>`);
  parts.push(`<g id="toks"${reduce ? "" : ` style="opacity:0"`}></g>`);
  svg.innerHTML = parts.join("");

  const tokLayer = $("#toks", svg);
  const edgeEls = {}, countEls = {}, badgeEls = {};
  $$("[data-e]", svg).forEach((el) => { edgeEls[el.dataset.e] = el; });
  $$("[data-c]", svg).forEach((el) => { countEls[el.dataset.c] = el; });
  $$("[data-b]", svg).forEach((el) => { badgeEls[el.dataset.b] = el; });
  const kPaid = $("#k-paid"), kCycle = $("#k-cycle"), kOnTime = $("#k-ontime");
  const kpiCycle = $("#kpi-cycle"), kpiOnTime = $("#kpi-ontime");
  const simToast = $("#sim-toast");
  let fmtInt, fmtDec, fmtPct;

  function dur(seg) {
    switch (seg) {
      case "s-po": case "pay-end": return 0.9;
      case "po-gr": return rnd(5, 9);
      case "po-price": return rnd(1.5, 3);
      case "price-gr": return rnd(5, 8);
      case "gr-inv": return rnd(2, 5);
      case "inv-pay": return rnd(14, 32);
      case "inv-block": return rnd(1.5, 3);
      case "block-pay": return flows ? rnd(9, 15) : rnd(24, 38);
      default: return 1;
    }
  }

  function spawn(render) {
    const c = { t0: time, start: time, i: 0, inv: 0, paidAt: 0, flag: false, el: null, painted: false };
    const price = Math.random() < 0.27, block = Math.random() < 0.36;
    c.r = ["s-po", ...(price ? ["po-price", "price-gr"] : ["po-gr"]), "gr-inv", ...(block ? ["inv-block", "block-pay"] : ["inv-pay"]), "pay-end"];
    c.d = dur(c.r[0]);
    counts[c.r[0]]++;
    active.push(c);
    if (render) attach(c);
  }

  function attach(c) {
    const el = pool.pop() || document.createElementNS("http://www.w3.org/2000/svg", "circle");
    el.setAttribute("r", "4.3");
    el.setAttribute("class", "tok");
    c.el = el;
    c.painted = false;
    tokLayer.appendChild(el);
  }

  function advance(c, render) {
    while (c.i < c.r.length && time >= c.start + c.d) {
      const end = c.start + c.d, seg = c.r[c.i];
      if (seg === "gr-inv") c.inv = end;
      if (seg === "inv-pay" || seg === "block-pay") { c.paidAt = end; paid++; }
      c.i++;
      c.start = end;
      if (c.i < c.r.length) {
        const next = c.r[c.i];
        c.d = dur(next);
        counts[next]++;
        if (next === "po-price" || next === "inv-block") c.flag = true;
        if (next === "block-pay" && flows && render) notifyBlock();
      }
    }
    return c.i >= c.r.length;
  }

  function step(days, render) {
    time += days;
    spawnAcc += days;
    while (spawnAcc >= SPAWN) { spawnAcc -= SPAWN; spawn(render); }
    for (let k = active.length - 1; k >= 0; k--) {
      const c = active[k];
      if (advance(c, render)) {
        recent.push({ cycle: c.paidAt - c.t0, late: c.paidAt - c.inv > 30 });
        if (recent.length > WINDOW) recent.shift();
        if (c.el) { c.el.remove(); pool.push(c.el); c.el = null; }
        active.splice(k, 1);
      }
    }
  }

  function draw() {
    for (const c of active) {
      if (!c.el) attach(c);
      const t = Math.min(1, (time - c.start) / c.d);
      const p = EDGES[c.r[c.i]].at(t);
      c.el.setAttribute("cx", p[0].toFixed(1));
      c.el.setAttribute("cy", p[1].toFixed(1));
      if (c.flag && !c.painted) { c.el.setAttribute("class", "tok flag"); c.painted = true; }
    }
  }

  function stats() {
    let max = 1;
    for (const k in counts) max = Math.max(max, counts[k]);
    for (const k in edgeEls) edgeEls[k].style.strokeWidth = (1.3 + 4.4 * Math.sqrt(counts[k] / max)).toFixed(2);
    for (const k in countEls) countEls[k].textContent = fmtInt.format(counts[k]);
    for (const k in badgeEls) {
      let n = 0;
      for (const c of active) if (c.r[c.i] === k) n++;
      badgeEls[k].classList.toggle("on", n > 0);
      badgeEls[k].querySelector("text").textContent = n;
    }
    kPaid.textContent = fmtInt.format(paid);
    if (recent.length) {
      let sum = 0, onTime = 0;
      for (const r of recent) { sum += r.cycle; if (!r.late) onTime++; }
      const avg = sum / recent.length, share = onTime / recent.length;
      kCycle.textContent = fmtDec.format(avg);
      kOnTime.textContent = fmtPct.format(share);
      kpiCycle.classList.toggle("good", avg <= 33);
      kpiCycle.classList.toggle("bad", avg >= 36);
      kpiOnTime.classList.toggle("good", share >= 0.88);
      kpiOnTime.classList.toggle("bad", share < 0.8);
    }
  }

  function notifyBlock() {
    const now = performance.now();
    if (now - lastAlert < 2600) return;
    lastAlert = now;
    const doc = "51056" + String(Math.floor(Math.random() * 1e5)).padStart(5, "0");
    simToast.innerHTML = `${icon("message")}<span>${esc(UI[lang].simToast(doc))}</span>`;
    simToast.classList.add("show");
    clearTimeout(notifyBlock.t);
    notifyBlock.t = setTimeout(() => simToast.classList.remove("show"), 2100);
    const ping = $("#ping", svg);
    ping.classList.remove("go");
    void ping.getBoundingClientRect();
    ping.classList.add("go");
  }

  // Fast-forward so the map opens with history, then animate in real time.
  function warm(days) {
    const steps = Math.round(days / 0.25);
    for (let i = 0; i < steps; i++) step(0.25, false);
  }
  warm(150);

  let raf = 0, last = 0, lastStats = 0, ready = reduce, inView = false;
  function loop(now) {
    const dt = Math.min(0.06, (now - last) / 1000);
    last = now;
    step(dt / SPD, true);
    draw();
    if (now - lastStats > 300) { stats(); lastStats = now; }
    raf = requestAnimationFrame(loop);
  }
  function sync() {
    const run = ready && inView && !document.hidden && !reduce;
    if (run && !raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
    if (!run && raf) { cancelAnimationFrame(raf); raf = 0; }
    $("#sim").classList.toggle("paused", !run);
  }
  new IntersectionObserver((es) => { inView = es[es.length - 1].isIntersecting; sync(); }, { threshold: 0.12 }).observe($("#sim"));
  document.addEventListener("visibilitychange", sync);
  setTimeout(() => { ready = true; tokLayer.style.opacity = ""; draw(); sync(); }, reduce ? 0 : 1350);

  return {
    setLang(l) {
      const T = UI[l];
      fmtInt = new Intl.NumberFormat(T.locale);
      fmtDec = new Intl.NumberFormat(T.locale, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      fmtPct = new Intl.NumberFormat(T.locale, { style: "percent", maximumFractionDigits: 0 });
      $$("[data-n]", svg).forEach((el) => { el.textContent = T.nodes[el.dataset.n]; });
      stats();
      if (reduce) draw();
    },
    setFlows(on) {
      flows = on;
      if (reduce) { warm(150); draw(); stats(); }
    }
  };
})();

/* ===================== Language ===================== */
function get(obj, path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj); }
let pqlOpen = false;

function applyLang(l, animate) {
  lang = l;
  const T = UI[l];
  document.documentElement.lang = l;
  $$("[data-i18n]").forEach((el) => { const v = get(T, el.dataset.i18n); if (typeof v === "string") el.textContent = v; });
  $$("[data-i18n-aria]").forEach((el) => { const v = get(T, el.dataset.i18nAria); if (typeof v === "string") el.setAttribute("aria-label", v); });
  $("#role").textContent = CV.role[l];
  $("#summary").textContent = CV.summary[l];
  $("#photo").alt = T.photoAlt;
  $("#pql-btn").textContent = pqlOpen ? T.hidePql : T.showPql;
  $("#jobs").innerHTML = renderJobs(l);
  $("#projects").innerHTML = renderProjects(l);
  $("#skills-grid").innerHTML = renderSkills(l);
  $("#edu-grid").innerHTML = renderEdu(l);
  $$(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.set === l)));
  Sim.setLang(l);
  watchPreviews();
  updateRail();
  moveIndicator();
  if (animate && !reduce) {
    const m = $("#main");
    m.classList.remove("swap");
    void m.offsetWidth;
    m.classList.add("swap");
  }
}

function langFromHash() {
  const h = (location.hash || "").slice(1);
  return h === "en" || h === "es" ? h : null;
}
function initialLang() {
  const h = langFromHash();
  if (h) return h;
  try { return (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en"; } catch (e) { return "es"; }
}

/* ===================== Scroll effects ===================== */
let previewObserver = null;
function watchPreviews() {
  const items = $$("[data-preview]");
  if (!("IntersectionObserver" in window)) { items.forEach((p) => p.classList.add("in-view")); return; }
  if (previewObserver) previewObserver.disconnect();
  previewObserver = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in-view"); previewObserver.unobserve(e.target); } });
  }, { threshold: 0.35 });
  items.forEach((p) => previewObserver.observe(p));
}

function updateRail() {
  const tl = $("#timeline");
  if (!tl) return;
  const r = tl.getBoundingClientRect();
  const anchor = window.innerHeight * 0.62;
  const p = Math.max(0, Math.min(1, (anchor - r.top) / r.height));
  $("#rail-fill").style.transform = `scaleY(${p.toFixed(4)})`;
  $$(".job", tl).forEach((j) => {
    const d = j.querySelector(".rail-dot").getBoundingClientRect();
    j.classList.toggle("lit", d.top + 8 < anchor);
  });
}
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { updateRail(); ticking = false; });
}, { passive: true });
window.addEventListener("resize", () => { updateRail(); moveIndicator(); });

const SECTIONS = ["exp", "proj", "skills", "edu", "contact"];
let activeSec = null;
function moveIndicator() {
  const ind = $("#nav-ind");
  const b = activeSec && $(`.bar-nav button[data-go="${activeSec}"]`);
  if (!b || !b.offsetWidth) { ind.style.opacity = "0"; return; }
  ind.style.opacity = "1";
  ind.style.width = `${b.offsetWidth - 24}px`;
  ind.style.transform = `translateX(${b.offsetLeft + 12}px)`;
}
function setActive(id) {
  activeSec = id;
  $$(".bar-nav button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.go === id)));
  moveIndicator();
}
const spy = new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
}, { rootMargin: "-42% 0px -52% 0px" });
SECTIONS.forEach((id) => spy.observe(document.getElementById(id)));
new IntersectionObserver((es) => {
  const e = es[es.length - 1];
  $("#bar").classList.toggle("scrolled", !e.isIntersecting);
  if (e.isIntersecting && e.boundingClientRect.top > 0) setActive(null);
}).observe($("#name"));

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (!go) return;
  const id = go.dataset.go;
  const el = document.getElementById(id);
  if (!el) return;
  if (id === "top") window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  else el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
});

/* ===================== Copy ===================== */
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  try {
    await navigator.clipboard.writeText(b.dataset.copy);
    b.classList.add("done");
    b.innerHTML = icon("check");
    toast(UI[lang].copied);
    setTimeout(() => { b.classList.remove("done"); b.innerHTML = icon("copy"); }, 1600);
  } catch (err) {
    toast(UI[lang].copyFail);
  }
});

/* ===================== PDF download ===================== */
function savePdf() {
  const file = `CV_Victor_Corchado_${lang.toUpperCase()}.pdf`;
  const a = document.createElement("a");
  a.href = file;
  a.download = file;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast(UI[lang].pdfSaved);
}
document.addEventListener("click", (e) => { if (e.target.closest("[data-pdf]")) savePdf(); });

/* ===================== Simulation controls ===================== */
const flowsInput = $("#flows");
flowsInput.addEventListener("change", () => {
  $("#flows-label").classList.remove("hint");
  Sim.setFlows(flowsInput.checked);
});
$("#pql-btn").addEventListener("click", () => {
  pqlOpen = !pqlOpen;
  $("#pql").hidden = !pqlOpen;
  const b = $("#pql-btn");
  b.setAttribute("aria-expanded", String(pqlOpen));
  b.textContent = pqlOpen ? UI[lang].hidePql : UI[lang].showPql;
});

/* ===================== Init ===================== */
paintIcons();
$$(".lang button").forEach((b) => b.addEventListener("click", () => {
  const l = b.dataset.set;
  if (l === lang) return;
  applyLang(l, true);
  if (langFromHash() !== l) location.hash = l;
}));
window.addEventListener("hashchange", () => { const h = langFromHash(); if (h && h !== lang) applyLang(h, true); });
applyLang(initialLang(), false);
})();
</script>
